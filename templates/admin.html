<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — Parallel Universe Self</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Raleway:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #030008;
      --bg-card:  #0a0015;
      --bg-row:   #0f0020;
      --border:   #1a0a3a;
      --purple:   #9333ea;
      --pink:     #ec4899;
      --green:    #4ade80;
      --amber:    #fbbf24;
      --red:      #f87171;
      --cyan:     #22d3ee;
      --white:    #f0e8ff;
      --muted:    #5a3a8a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
    }

    /* Stars */
    .stars {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:0.9;} }

    /* Header */
    .header {
      position: relative; z-index: 10;
      padding: 2rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(147,51,234,0.08) 0%, transparent 100%);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }

    .header-left { display: flex; align-items: center; gap: 1rem; }

    .admin-badge {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 20px rgba(147,51,234,0.4);
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .btn-refresh {
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(147,51,234,0.3);
    }
    .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(147,51,234,0.4); }

    /* Main */
    .main {
      position: relative; z-index: 5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: flex; flex-direction: column; gap: 1.5rem;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(10,0,21,0.97), rgba(15,0,35,0.95));
      border: 1px solid rgba(147,51,234,0.25);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      transition: all 0.2s ease;
    }
    .stat-card:hover { border-color: rgba(147,51,234,0.5); transform: translateY(-2px); }

    .stat-icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .si-purple { background: rgba(147,51,234,0.15); }
    .si-green  { background: rgba(74,222,128,0.12); }
    .si-amber  { background: rgba(251,191,36,0.12); }
    .si-cyan   { background: rgba(34,211,238,0.12); }

    .stat-info {}
    .stat-value {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
    }

    /* Search + Filter */
    .toolbar {
      display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: rgba(147,51,234,0.5); }

    .sort-select {
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--white);
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }

    .btn-export {
      padding: 0.7rem 1.2rem;
      border: 1.5px solid rgba(74,222,128,0.4);
      background: rgba(74,222,128,0.08);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .btn-export:hover { background: rgba(74,222,128,0.15); border-color: var(--green); }

    /* Table */
    .table-card {
      background: linear-gradient(135deg, rgba(10,0,21,0.97), rgba(15,0,35,0.95));
      border: 1px solid rgba(147,51,234,0.2);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(147,51,234,0.05);
    }

    .th-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      color: var(--purple);
    }

    .th-count {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      background: rgba(147,51,234,0.1);
      border: 1px solid rgba(147,51,234,0.2);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: rgba(147,51,234,0.06);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 0.85rem 1.5rem;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--purple); }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }
    tbody tr:hover { background: rgba(147,51,234,0.06); }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 1rem 1.5rem;
      font-size: 0.88rem;
    }

    .td-id {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .td-avatar {
      display: flex; align-items: center; gap: 0.75rem;
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 0.9rem;
      color: white;
      flex-shrink: 0;
    }

    .td-name { font-weight: 600; color: var(--white); }
    .td-name-sub { font-size: 0.75rem; color: var(--muted); font-family: 'Space Mono', monospace; }

    .td-email {
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      color: var(--cyan);
    }

    .td-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .status-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.25);
      color: var(--green);
    }
    .sb-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* Empty State */
    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--muted);
    }
    .es-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    .es-text { font-family: 'Space Mono', monospace; font-size: 0.82rem; }

    /* Loading */
    .loading-row td {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      position: relative; z-index: 5;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      th, td { padding: 0.75rem 1rem; }
      .td-date { display: none; }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="admin-badge">👁️</div>
      <div>
        <div class="header-title">ADMIN DASHBOARD</div>
        <div class="header-sub">Parallel Universe Self · User Registry</div>
      </div>
    </div>
    <button class="btn-refresh" onclick="loadUsers()">⟳ Refresh</button>
  </header>

  <main class="main">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon si-purple">👥</div>
        <div class="stat-info">
          <div class="stat-value" id="statTotal">—</div>
          <div class="stat-label">TOTAL USERS</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-green">📅</div>
        <div class="stat-info">
          <div class="stat-value" id="statToday">—</div>
          <div class="stat-label">JOINED TODAY</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-amber">🌌</div>
        <div class="stat-info">
          <div class="stat-value" id="statLatest">—</div>
          <div class="stat-label">LATEST USER</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-cyan">⚡</div>
        <div class="stat-info">
          <div class="stat-value" id="statStatus">ON</div>
          <div class="stat-label">SYSTEM STATUS</div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="search-input" id="searchInput" type="text"
             placeholder="🔍 Search by name or email..."
             oninput="filterUsers()"/>
      <select class="sort-select" id="sortSelect" onchange="filterUsers()">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="name">Name A-Z</option>
      </select>
      <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <span class="th-title">⟁ REGISTERED USERS</span>
        <span class="th-count" id="tableCount">Loading...</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>USER</th>
            <th>EMAIL</th>
            <th>JOINED</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr class="loading-row">
            <td colspan="5">⟳ Loading users...</td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="es-icon">🌌</div>
        <p class="es-text">No users found.</p>
      </div>
    </div>

  </main>

  <footer class="footer">
    Admin Dashboard · Parallel Universe Self · {{ admin_key_hint }}
  </footer>

  <script>
    // Stars
    const sc = document.getElementById("stars");
    for (let i = 0; i < 120; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const sz = Math.random() * 2 + 0.5;
      s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*4+2}s;--delay:${Math.random()*5}s;opacity:${Math.random()*0.5+0.1}`;
      sc.appendChild(s);
    }

    // Colors for avatars
    const COLORS = [
      "linear-gradient(135deg,#7c3aed,#db2777)",
      "linear-gradient(135deg,#0891b2,#7c3aed)",
      "linear-gradient(135deg,#db2777,#f59e0b)",
      "linear-gradient(135deg,#059669,#0891b2)",
      "linear-gradient(135deg,#d97706,#dc2626)",
    ];

    let allUsers = [];

    async function loadUsers() {
      const key = new URLSearchParams(window.location.search).get("key") || "";
      document.getElementById("userTableBody").innerHTML =
        `<tr class="loading-row"><td colspan="5">⟳ Loading...</td></tr>`;

      try {
        const res  = await fetch(`/admin/users?key=${encodeURIComponent(key)}`);
        const data = await res.json();

        if (!res.ok) {
          document.getElementById("userTableBody").innerHTML =
            `<tr class="loading-row"><td colspan="5">⚠ ${data.error || "Unauthorized"}</td></tr>`;
          return;
        }

        allUsers = data.users || [];
        updateStats(data);
        renderTable(allUsers);

      } catch (e) {
        document.getElementById("userTableBody").innerHTML =
          `<tr class="loading-row"><td colspan="5">⚠ Failed to load. Check your connection.</td></tr>`;
      }
    }

    function updateStats(data) {
      document.getElementById("statTotal").textContent = data.total || 0;

      // Today count
      const today = new Date().toISOString().split("T")[0];
      const todayCount = (data.users || []).filter(u =>
        u.joined_at && u.joined_at.startsWith(today)
      ).length;
      document.getElementById("statToday").textContent = todayCount;

      // Latest user
      const latest = data.users && data.users[0];
      document.getElementById("statLatest").textContent =
        latest ? latest.name.split(" ")[0] : "—";
    }

    function renderTable(users) {
      const tbody = document.getElementById("userTableBody");
      const empty = document.getElementById("emptyState");
      const count = document.getElementById("tableCount");

      count.textContent = `${users.length} user${users.length !== 1 ? "s" : ""}`;

      if (users.length === 0) {
        tbody.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      tbody.innerHTML = users.map((u, i) => {
        const initials = u.name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2);
        const color    = COLORS[u.id % COLORS.length];
        const date     = formatDate(u.joined_at);
        const shortName = u.name.length > 18 ? u.name.slice(0,18) + "…" : u.name;

        return `
          <tr>
            <td class="td-id">#${u.id}</td>
            <td>
              <div class="td-avatar">
                <div class="avatar" style="background:${color}">${initials}</div>
                <div>
                  <div class="td-name">${escHTML(shortName)}</div>
                </div>
              </div>
            </td>
            <td class="td-email">${escHTML(u.email)}</td>
            <td class="td-date">${date}</td>
            <td>
              <span class="status-badge">
                <span class="sb-dot"></span> ACTIVE
              </span>
            </td>
          </tr>
        `;
      }).join("");
    }

    function filterUsers() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const sort  = document.getElementById("sortSelect").value;

      let filtered = allUsers.filter(u =>
        u.name.toLowerCase().includes(query) ||
        u.email.toLowerCase().includes(query)
      );

      if (sort === "oldest") filtered = [...filtered].reverse();
      else if (sort === "name") filtered = [...filtered].sort((a,b) => a.name.localeCompare(b.name));

      renderTable(filtered);
    }

    function exportCSV() {
      if (!allUsers.length) return;
      const rows = [["ID","Name","Email","Joined"]];
      allUsers.forEach(u => rows.push([u.id, u.name, u.email, u.joined_at]));
      const csv  = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = "parallel_universe_users.csv";
      a.click();
    }

    function formatDate(str) {
      if (!str) return "—";
      const d = new Date(str);
      return d.toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function escHTML(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // Load on start
    loadUsers();
    // Auto-refresh every 30s
    setInterval(loadUsers, 30000);
  </script>
</body>
</html>
